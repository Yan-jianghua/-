plugins { id 'com.android.application' }

android {
    namespace 'games.qiuqiu.planet'
    compileSdk 35
    defaultConfig {
        applicationId 'games.qiuqiu.planet'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    sourceSets.main.assets.srcDirs = ['../../dist']
}

tasks.named('preBuild').configure {
    doFirst {
        if (!file('../../dist/index.html').isFile()) {
            throw new GradleException('请先在 app 目录执行 npm run build')
        }
    }
}
