<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101830" />
    <title>球球星球 · 共振星门</title>
  </head>
  <body>
    <main id="lobby">
      <section class="cover" aria-label="共振星门">
        <div class="orbit"><i></i><b></b></div>
        <div class="cover-title">
          <small>球球星球</small>
          <h1>共振星门</h1>
          <p>交换符文线索，一起点亮三座星门。</p>
        </div>
      </section>
      <section class="panel">
        <form id="auth">
          <h2>进入双人星图</h2>
          <label id="endpoint-field" hidden
            >联机服务地址<input
              id="endpoint"
              type="url"
              placeholder="https://你的服务器"
          /></label>
          <label
            >游戏账号<input
              id="user"
              minlength="3"
              maxlength="24"
              autocomplete="username"
              placeholder="3–24 位字符"
              required
          /></label>
          <label
            >密码<input
              id="pass"
              type="password"
              minlength="6"
              maxlength="128"
              autocomplete="current-password"
              required
          /></label>
          <div class="actions">
            <button value="login">登录</button
            ><button class="quiet" value="register">注册并进入</button>
          </div>
        </form>
        <form id="rooms" hidden>
          <small id="account"></small>
          <h2>与搭档会合</h2>
          <button id="create" type="button">创建双人房间</button>
          <label
            >搭档的房间码<input
              id="code"
              maxlength="6"
              minlength="6"
              pattern="[a-fA-F0-9]{6}"
              placeholder="六位房间码"
              required
          /></label>
          <div class="actions">
            <button>加入房间</button
            ><button id="logout" type="button" class="quiet">切换账号</button>
          </div>
        </form>
        <p id="error" role="status"></p>
      </section>
    </main>
    <main id="play" hidden>
      <header>
        <div>
          <small id="identity"></small>
          <h2 id="title">等待搭档</h2>
        </div>
        <div>
          <strong id="room"></strong>
          <button id="exit" class="quiet">离开房间</button>
        </div>
      </header>
      <div class="field">
        <canvas id="board" aria-label="星图，拖动控制自己的球"></canvas>
      </div>
      <section class="console">
        <div>
          <strong id="clue"></strong>
          <p id="rule"></p>
          <p id="feedback" role="status"></p>
        </div>
        <button id="pulse">共振</button><button id="retry" hidden>重连</button
        ><button id="again" hidden>再玩一次</button>
      </section>
      <footer>
        <div id="signals" aria-label="发送符文">
          <span>给搭档报点</span>
          <button data-rune="0" class="quiet">月</button>
          <button data-rune="1" class="quiet">潮</button>
          <button data-rune="2" class="quiet">花</button>
          <strong id="received" aria-live="polite"></strong>
        </div>
        拖动星图或用方向键移动 · 空格共振
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
