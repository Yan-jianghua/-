<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101934" />
    <title>球球星球 · 缘分光带原型</title>
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" aria-label="球球星球缘分光带原型"></canvas>
      <section class="hud" aria-live="polite">
        <div class="brand">
          <span class="eyebrow">球球星球</span>
          <h1>缘分光带</h1>
        </div>
        <div class="objective" id="objective">一起收集星尘 0 / 5</div>
        <button id="reset" type="button">重新开始</button>
      </section>
      <section class="hint" id="hint">
        <strong>双人协作原型</strong>
        <span>左侧球：WASD　右侧球：方向键</span>
        <span>手机上按住左右两侧拖动控制两颗球</span>
      </section>
      <div class="complete" id="complete" hidden>
        <p>星球亮起来了</p>
        <button id="play-again" type="button">再玩一次</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
